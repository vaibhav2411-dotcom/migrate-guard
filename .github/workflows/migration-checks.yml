name: Migration Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: npm ci
      - name: Hydration smoke tests
        run: npm run check:hydration
      - name: SEO regression
        run: npm run check:seo || true
      - name: Axe accessibility
        run: npm run check:axe || true
      - name: Generate bug CSV
        run: npm run gen:bugcsv || true
